PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS="Velden - Pretty Protected Downloads"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_LABEL="Pretty Protected Downloads (%s)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_XML_DESCRIPTION="Een extra veld voor bestanden die alleen gedownload mogen worden door bezoekers die het artikel, de categorie, de contactpersoon of het gebruikersprofiel mogen zien waar ze bij horen. Bestanden staan buiten de webroot en elke download wordt gecontroleerd tegen de toegangsniveaus van het item, het veld en de veldgroep."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_INSTALLERSCRIPT_INSTALL="<p>Pretty Protected Downloads is geïnstalleerd en ingeschakeld. Open <strong>Systeem &rarr; Plugins &rarr; Velden - Pretty Protected Downloads</strong> om te kiezen waar de bestanden worden opgeslagen, en voeg daarna een veld van dit type toe onder <strong>Content &rarr; Velden</strong>.</p>"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_INSTALLERSCRIPT_UPDATE="<p>Pretty Protected Downloads is bijgewerkt.</p>"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_INSTALLERSCRIPT_UNINSTALL="<p>Pretty Protected Downloads is verwijderd. De opgeslagen bestanden staan nog in hun map; verwijder ze zelf als ze niet meer nodig zijn.</p>"
