PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS="Fields - Pretty Protected Downloads"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_LABEL="Pretty Protected Downloads (%s)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_XML_DESCRIPTION="A custom field for files that should only be downloaded by the visitors allowed to see the article. Files are stored outside the web root and every download is checked against the article, category, field and field group access levels."
