PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS="Fields - Pretty Protected Downloads"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_LABEL="Pretty Protected Downloads (%s)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_XML_DESCRIPTION="A custom field for files that should only be downloaded by the visitors allowed to see the article, category, contact or user profile they belong to. Files are stored outside the web root, or in a folder inside it that is closed to direct access, and every download is checked against the item, field and field group access levels."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_LOGO_DESC="<img src=\"../media/plg_fields_prettyprotecteddownloads/logo.svg\" height=\"100px\" title=\"Pretty Protected Downloads Logo\">"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_OWNERINFO_DESC="<p><a href=\"https://volunteers.joomla.org/joomlers/11698-tom-van-der-laan\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-user-circle fa-fw\" aria-hidden=\"true\"></i> Created by Tom van der Laan</a><br><a href=\"https://tlwebdesign.nl/\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-building fa-fw\" aria-hidden=\"true\"></i> TLWebdesign.nl</a><br><a href=\"https://github.com/TLWebdesignNL/Pretty-Protected-Downloads\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fab fa-github fa-fw\" aria-hidden=\"true\"></i> Github Project Page</a><br><a href=\"https://github.com/TLWebdesignNL/Pretty-Protected-Downloads/issues\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-question-circle fa-fw\" aria-hidden=\"true\"></i> Support</a></p>"

; Plugin settings
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELDSET_STORAGE_LABEL="Storage"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELDSET_UPLOADS_LABEL="Uploads"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELDSET_DOWNLOADS_LABEL="Downloads"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_METHOD_LABEL="Storage Location"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_METHOD_DESC="Outside the web root the files have no URL at all, on any web server. Inside the web root the folder is closed with an .htaccess file, which only Apache and LiteSpeed read."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_METHOD_OUTSIDE="Outside the web root (recommended)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_METHOD_WEBROOT="Inside the web root, closed with .htaccess"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_PATH_LABEL="Folder"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_PATH_OUTSIDE_DESC="The absolute server path of the folder to store the files in, next to rather than inside the website folder. It is created on the first upload when it does not exist yet."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_PATH_WEBROOT_DESC="A folder relative to the website folder. Leave empty to use files/prettyprotecteddownloads."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_STATUS_LABEL="Status"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_STORAGE_STATUS_DESC="The folder as last saved. Save the settings to check a new folder."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_CLEANUP_GRACE_LABEL="Keep Unused Uploads For (days)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_CLEANUP_GRACE_DESC="How long a file that was uploaded but never saved with its item is kept before <em>Delete unused files</em> may remove it. Keep it longer than an editor may leave an item open. Files of a deleted item are removed at once when no other item uses them."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_EXTENSIONS_LABEL="Allowed File Types"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_EXTENSIONS_DESC="Comma separated file extensions editors may upload. Scripts, web pages and SVG images are never accepted, even when listed."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_MAX_SIZE_LABEL="Maximum File Size (MB)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_MAX_SIZE_DESC="The largest file editors may upload. The server's own PHP upload limit applies as well; the status above shows the limit that is in effect."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_ARCHIVE_CODE_LABEL="Allow Code Inside Zip Archives"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_ARCHIVE_CODE_DESC="Accept zip archives that contain code, such as an extension package with PHP files. Normally every upload is refused when PHP is found in it. With this on, the content of a zip archive is no longer inspected; its name is, and so are all other file types. The archive is stored and downloaded as it is and never unpacked or run by this plugin. Leave this off unless you offer such archives for download: the inspection is an extra safeguard should another extension on the site ever have a vulnerability that lets an attacker run a file of their choice."
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_TOKEN_LIFETIME_LABEL="Download Button Lifetime (minutes)"
PLG_FIELDS_PRETTYPROTECTEDDOWNLOADS_FIELD_TOKEN_LIFETIME_DESC="How long a download button keeps working after the page was loaded. A visitor who waits longer is asked to reload the page."

