name: Release

on:
  push:
    tags:
      - 'V*'

jobs:
  update-xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and build download URL
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#V}"
          ZIP_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.zip"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_url=${ZIP_URL}" >> $GITHUB_OUTPUT

      - name: Download release zip and compute SHA256
        id: sha256
        run: |
          curl -fL -o release.zip "${{ steps.vars.outputs.zip_url }}"
          SHA=$(sha256sum release.zip | awk '{print $1}')
          echo "value=${SHA}" >> $GITHUB_OUTPUT

      - name: Append entry to updates.xml
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ZIP_URL: ${{ steps.vars.outputs.zip_url }}
          SHA256: ${{ steps.sha256.outputs.value }}
        run: |
          python3 - <<'EOF'
          import os

          version = os.environ["VERSION"]
          zip_url = os.environ["ZIP_URL"]
          sha256  = os.environ["SHA256"]

          with open("updates.xml", "r") as f:
              content = f.read()

          if f"<version>{version}</version>" in content:
              print(f"Version {version} already exists, skipping.")
              raise SystemExit(0)

          # Every entry is written from this one template rather than copied from the
          # previous entry, so the first release needs no hand-made entry to copy and
          # a mistake in one entry is never carried into the next.
          block = f"""    <update>
                  <name>Pretty Protected Downloads {version}</name>
                  <description/>
                  <element>prettyprotecteddownloads</element>
                  <type>plugin</type>
                  <folder>fields</folder>
                  <client>site</client>
                  <version>{version}</version>
                  <infourl title="Pretty Protected Downloads">https://github.com/TLWebdesignNL/Pretty-Protected-Downloads</infourl>
                  <downloads>
                      <downloadurl type="full" format="zip">{zip_url}</downloadurl>
                  </downloads>
                  <tags>
                      <tag>stable</tag>
                  </tags>
                  <sha256>{sha256}</sha256>
                  <maintainer>TLWebdesign</maintainer>
                  <maintainerurl>https://www.tlwebdesign.nl/</maintainerurl>
                  <section>Updates</section>
                  <targetplatform name="joomla" version="(5|6)\\..*"/>
                  <php_minimum>8.1</php_minimum>
              </update>
          """
          block = block.rstrip() + "\n"

          content = content.replace("</updates>", block + "</updates>")
          with open("updates.xml", "w") as f:
              f.write(content)
          print(f"Added version {version} (sha256: {sha256})")
          EOF

      - name: Commit and push updated updates.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: add updates.xml entry for ${{ steps.vars.outputs.tag }}"
          git push origin main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          # Build release notes from the matching changelog.xml entry.
          python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET

          version  = os.environ["VERSION"]
          headings = {
              "security": "Security",
              "addition": "New",
              "change":   "Changed",
              "fix":      "Fixed",
              "note":     "Notes",
          }

          notes = ""
          try:
              root  = ET.parse("changelog.xml").getroot()
              entry = next(
                  (c for c in root.findall("changelog")
                   if (c.findtext("version") or "").strip() == version),
                  None,
              )
              if entry is not None:
                  for tag, title in headings.items():
                      lines = []
                      for el in entry.findall(tag):
                          items = el.findall("item")
                          if items:
                              lines += ["".join(i.itertext()).strip() for i in items]
                          else:
                              lines.append("".join(el.itertext()).strip())
                      lines = [l for l in lines if l]
                      if lines:
                          notes += f"## {title}\n\n"
                          notes += "\n".join(f"- {l}" for l in lines) + "\n\n"
          except Exception as e:
              print(f"Could not parse changelog.xml: {e}")

          with open("release_notes.md", "w") as f:
              f.write(notes.strip() + "\n")
          EOF

          if grep -q '[^[:space:]]' release_notes.md 2>/dev/null; then
            gh release create "$TAG" --title "Pretty Protected Downloads ${VERSION}" --notes-file release_notes.md
          else
            echo "No changelog entry for ${VERSION}; falling back to auto-generated notes."
            gh release create "$TAG" --title "Pretty Protected Downloads ${VERSION}" --generate-notes
          fi
